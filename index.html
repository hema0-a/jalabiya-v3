<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1F6D57" />
  <meta name="description" content="تطبيق ورشة تفصيل الجلابيب" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ورشة الجلابيب" />

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://www.gstatic.com https://apis.google.com;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src 'self' https://fonts.gstatic.com;
                 img-src 'self' data: blob:;
                 connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com;
                 worker-src 'self';
                 manifest-src 'self';
                 object-src 'none';
                 base-uri 'self';
                 form-action 'self';" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/main.css" />

  <title>ورشة تفصيل الجلابيب</title>

  <style>
    body {
      background: #F6F1E6;
      color: #1F6D57;
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    #app > .boot {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 15px;
      color: #2E8B6F;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <div class="boot">جارٍ التحميل…</div>
  </div>

  <script>
  // مُلتقِط أخطاء مؤقت — يُظهر الأخطاء على الشاشة
  window.addEventListener('error', function(e) {
    var app = document.getElementById('app');
    if (app) {
      app.innerHTML = '<pre style="padding:16px;background:#fee;color:#900;font-size:12px;white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;font-family:monospace;min-height:100vh;box-sizing:border-box;margin:0;overflow:auto;">❌ ' +
        (e.message || 'Unknown error') + '\n\n' +
        'File: ' + (e.filename || '?') + '\n' +
        'Line: ' + (e.lineno || '?') + '\n\n' +
        'Stack:\n' + (e.error && e.error.stack ? e.error.stack : 'N/A') +
        '</pre>';
    }
  });
  window.addEventListener('unhandledrejection', function(e) {
    var app = document.getElementById('app');
    if (app) {
      app.innerHTML = '<pre style="padding:16px;background:#fee;color:#900;font-size:12px;white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;font-family:monospace;min-height:100vh;box-sizing:border-box;margin:0;overflow:auto;">❌ Promise Rejection:\n\n' +
        (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '\n\n' +
        'Stack:\n' + (e.reason && e.reason.stack ? e.reason.stack : 'N/A') +
        '</pre>';
    }
  });
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
