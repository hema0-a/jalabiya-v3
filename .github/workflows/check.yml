name: check

# يعمل على كل push إلى main وعلى كل Pull Request. لو فشل أي فحص يظهر ❌ على الـ commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: فحص ثابت (صياغة + اتساق + قائمة الكاش + سكربتات)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # صياغة كل ملفات js + اتساق الإصدار + مطابقة PRECACHE_URLS للمولَّدة
      - run: npm run check:static
      # اختبارات سكربتات الأدوات (apply-update.sh ومولّد الكاش) على مشروع مؤقت
      - run: npm run test:scripts

  browser:
    name: اختبارات المتصفح + كل الصفحات (${{ matrix.tz }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Africa/Cairo: مصر تطبّق التوقيت الصيفي — يكشف أخطاء حدود اليوم (25/23 ساعة)
        tz: [UTC, Africa/Cairo]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.tz == 'UTC' && 'utc' || 'cairo' }}
          path: test-results/
          if-no-files-found: ignore

  # نقطة فحص واحدة ثابتة الاسم (للاعتماد عليها في حماية الفرع Branch protection)
  ci-ok:
    name: ✅ كل الفحوص نجحت
    if: always()
    needs: [static, browser]
    runs-on: ubuntu-latest
    steps:
      - name: تحقق من نتيجة الوظائف
        run: |
          echo "static=${{ needs.static.result }} browser=${{ needs.browser.result }}"
          [ "${{ needs.static.result }}" = "success" ] && [ "${{ needs.browser.result }}" = "success" ]
