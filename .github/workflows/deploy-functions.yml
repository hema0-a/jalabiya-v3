name: Deploy Firebase (functions + rules)

# تشغيل يدوي فقط: GitHub ← Actions ← "Deploy Firebase" ← Run workflow
# يحتاج سرّاً واحداً في المستودع: FIREBASE_SERVICE_ACCOUNT (محتوى ملف JSON لحساب خدمة
# بصلاحيات Firebase Admin / Cloud Functions Admin / Service Account User) — انظر docs/PUSH-SETUP.md
on:
  workflow_dispatch:
    inputs:
      project:
        description: معرّف مشروع Firebase
        default: jalabiya-workshop-v2
        required: true
      what:
        description: ماذا تنشر؟
        type: choice
        default: functions
        options: [functions, rules, both]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: اختبار منطق الإشعارات
        run: node --test --test-reporter=spec scripts/tests/push-logic.test.cjs
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm install -g firebase-tools@13
      - name: نشر
        run: |
          case "${{ inputs.what }}" in
            functions) ONLY="functions" ;;
            rules)     ONLY="firestore:rules" ;;
            both)      ONLY="functions,firestore:rules" ;;
          esac
          firebase deploy --only "$ONLY" --project "${{ inputs.project }}" --non-interactive
